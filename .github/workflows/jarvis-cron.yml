name: Jarvis — оповещения

# Режим «только iPhone»: когда приложение закрыто, Jarvis всё равно напоминает и предупреждает в Telegram.
# Раз в 15 минут: напоминания из Jarvis/Reminders.md, утренний брифинг, упавшие сборки CI проектов.
#
# Настройка (Settings → Secrets and variables → Actions):
#   Variables: VAULT_REPO = владелец/репозиторий-памяти (например c4erepk0/jarvis-vault)
#              BRIEFING_TIME = 08:30, TIMEZONE = Europe/Moscow, WEATHER_CITY / WEATHER_LAT / WEATHER_LON — по желанию
#   Secrets:   VAULT_TOKEN — fine-grained токен: Contents read/write на репозиторий памяти
#                            (+ Actions/Issues read на репозитории проектов — для статуса CI)
#              TELEGRAM_BOT_TOKEN, TELEGRAM_OWNER_ID — бот от @BotFather и ваш Telegram ID
#              IPASTORE_JARVIS_TOKEN — по желанию, метрики IPAStore в брифинге
# Минуты Actions: публичный репозиторий — бесплатно; приватный — около 1500 минут в месяц
# (уменьшите частоту в cron ниже, если не хватает).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: jarvis-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    if: vars.VAULT_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.VAULT_REPO }}
          token: ${{ secrets.VAULT_TOKEN }}
          path: vault
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Проход Jarvis
        env:
          VAULT_PATH: vault
          JARVIS_DATA_DIR: /tmp/jarvis-data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GITHUB_TOKEN: ${{ secrets.VAULT_TOKEN }}
          IPASTORE_JARVIS_TOKEN: ${{ secrets.IPASTORE_JARVIS_TOKEN }}
          BRIEFING_TIME: ${{ vars.BRIEFING_TIME || '08:30' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Moscow' }}
          WEATHER_CITY: ${{ vars.WEATHER_CITY || 'Москва' }}
          WEATHER_LAT: ${{ vars.WEATHER_LAT || '55.7558' }}
          WEATHER_LON: ${{ vars.WEATHER_LON || '37.6173' }}
          TTS_ENGINE: browser
        run: python -m jarvis.cron
      - name: Сохранить изменения в память
        working-directory: vault
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "Jarvis"
          git config user.email "jarvis@users.noreply.github.com"
          git add -A
          git commit -q -m "Jarvis: оповещения"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 3))
          done
          exit 1
