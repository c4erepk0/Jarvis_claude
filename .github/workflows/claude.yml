name: Claude

# Напишите @claude в задаче или комментарии — Claude сделает изменения в ветке и откроет PR.
# Jarvis сам создаёт такие задачи командой «поручи Jarvis: …».
# Нужен секрет CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) или ANTHROPIC_API_KEY
# и установленное приложение https://github.com/apps/claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association ||
        github.event.issue.author_association) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') ||
          contains(github.event.issue.title, '@claude') ||
          (github.event.action == 'labeled' && github.event.label.name == 'claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Окружение для тестов
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowedTools "Bash(make:*),Bash(.venv/bin/python:*),Bash(.venv/bin/pytest:*),Bash(git:*),Bash(gh:*),Bash(node --check:*)"
            --append-system-prompt "Отвечай и пиши описания PR на русском. Перед коммитом запускай make check. Следуй правилам из CLAUDE.md."
